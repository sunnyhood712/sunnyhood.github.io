            <article>
                <p>今夜月儿圆 </p><p>下班吃过晚饭，习惯性的提半桶水到楼顶去给菜浇水，塌上顶楼的那一瞬间，感到整个楼面被月光笼罩，抬头望向天空，一轮明月悬挂在空中，周边像蒙了一层薄雾，又像罩了块大的纱盖，静谧而温柔，此情景适合静静呆着，晚风吹过，像一双温柔的手抚摸脸颊，白天所有的烦闷都会消散掉，享受难得属于自己的时光，此刻这儿是我的精神家园，在这儿我可以尽情默默落泪，也可以尽情歌唱，还可以自言自语。她接纳着一个孤独的人，让我消解掉负面情绪，第二天继续工作生活下去。感谢造物者的恩赐！</p>
            </article>
