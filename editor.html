<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>随心所想 · 写文章</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; font-family: -apple-system, "Microsoft YaHei", sans-serif; background: linear-gradient(180deg, #fff7ed 0%, #ffedd5 100%); color: #3f2f24; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; background: rgba(255, 251, 245, 0.95); padding: 24px; border-radius: 16px; box-shadow: 0 4px 18px rgba(180, 83, 9, 0.1); border: 1px solid #fde6c8; }
        h1 { font-size: 1.5rem; color: #7c2d12; margin-top: 0; text-align: center; }
        label { display: block; margin: 15px 0 5px; color: #9a3412; font-weight: bold; }
        input, textarea { width: 100%; padding: 12px; border: 2px solid #fed7aa; border-radius: 8px; font-size: 1rem; font-family: inherit; color: #3f2f24; background: #fff; box-sizing: border-box; }
        textarea { height: 300px; resize: vertical; line-height: 1.6; }
        button { width: 100%; padding: 14px; margin-top: 20px; background: #c2410c; color: #fff; border: none; border-radius: 999px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 12px rgba(194, 65, 12, 0.25); transition: all 0.2s; }
        button:active { background: #9a3412; transform: scale(0.98); }
        .status { margin-top: 15px; text-align: center; font-size: 0.9rem; min-height: 20px; }
        .success { color: #2e7d32; }
        .error { color: #d32f2f; }
        .token-area { margin-top: 20px; padding: 15px; background: #fff3e0; border-radius: 8px; font-size: 0.85rem; border: 1px dashed #ffcc80; }
        .token-area input { margin-top: 5px; font-family: monospace; font-size: 0.8rem; }
        .token-area button { margin-top: 10px; padding: 8px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 写一篇新文章</h1>
        
        <div id="auth-section" class="token-area">
            <p>第一次使用请粘贴您的 GitHub Token（只需设置一次，以后会记住）：</p>
            <input type="password" id="token-input" placeholder="粘贴 ghp_... 或 github_pat_...">
            <button onclick="saveToken()">保存 Token</button>
        </div>

        <div id="editor-section" style="display:none;">
            <label>文章标题</label>
            <input type="text" id="title" placeholder="例如：我的种菜日记">
            
            <label>正文内容</label>
            <textarea id="content" placeholder="在这里写下你的散文..."></textarea>
            
            <button onclick="publishArticle()">🚀 发布到网站</button>
            <div id="status" class="status"></div>
        </div>
    </div>

    <script>
        // 配置信息
        const REPO_OWNER = 'sunnyhood712';
        const REPO_NAME = 'sunnyhood.github.io';
        const ESSAYS_FOLDER = 'essays/';

        // 页面加载时检查 Token
        window.onload = function() {
            const savedToken = localStorage.getItem('github_token');
            if (savedToken) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('editor-section').style.display = 'block';
            }
        };

        // 保存 Token
        function saveToken() {
            const token = document.getElementById('token-input').value.trim();
            if (!token) { alert('Token 不能为空'); return; }
            localStorage.setItem('github_token', token);
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('editor-section').style.display = 'block';
        }

        // 发布文章
        async function publishArticle() {
            const token = localStorage.getItem('github_token');
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();
            const statusDiv = document.getElementById('status');

            if (!title || !content) {
                statusDiv.innerHTML = '标题和内容都不能为空哦！';
                statusDiv.className = 'status error';
                return;
            }

            statusDiv.innerHTML = '正在发布中，请稍候...';
            statusDiv.className = 'status';

            // 生成文件名：日期-标题（去掉空格和特殊字符）
            const date = new Date().toISOString().slice(0, 10);
            const safeTitle = title.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '-');
            const filename = `${date}-${safeTitle}.html`;

            // 生成 HTML 内容
            const articleHtml = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>${title} | 随心所想</title>
    <style>
        body { margin: 0; font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif; line-height: 1.9; color: #3f2f24; background: linear-gradient(180deg, #fff7ed 0%, #ffedd5 100%); min-height: 100vh; }
        .container { max-width: 760px; margin: 0 auto; padding: 40px 20px; }
        header { padding: 40px 0 20px; }
        h1 { font-size: 2rem; margin: 0 0 10px; color: #7c2d12; }
        .date { color: #a16207; font-size: 0.95rem; }
        .back { margin-bottom: 20px; }
        a { color: #c2410c; text-decoration: none; }
        a:hover { text-decoration: underline; color: #9a3412; }
        article { background: rgba(255, 251, 245, 0.9); padding: 32px; margin: 20px 0; border-radius: 16px; box-shadow: 0 4px 18px rgba(180, 83, 9, 0.10); border: 1px solid #fde6c8; }
        article p { margin: 0 0 1.2em; text-indent: 2em; font-size: 1.05rem; }
        footer { text-align: center; color: #a16207; padding: 30px 0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <p class="back"><a href="index.html">← 返回散文集首页</a></p>
            <h1>${title}</h1>
            <p class="date">${date}</p>
        </header>
        <main>
            <article>
                ${content.split('\n').filter(p => p.trim()).map(p => `<p>${p}</p>`).join('')}
            </article>
        </main>
        <footer>
            © 2026 小草. All rights reserved.
        </footer>
    </div>
</body>
</html>`;

            // 将内容转为 base64
            const base64Content = btoa(unescape(encodeURIComponent(articleHtml)));

            // 调用 GitHub API
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${ESSAYS_FOLDER}${filename}`;
            
            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: `发布新文章：${title}`,
                        content: base64Content,
                        branch: 'main'
                    })
                });

                if (response.ok) {
                    statusDiv.innerHTML = '✅ 发布成功！1分钟后网站就会更新！<br><br>您可以返回散文集首页查看。';
                    statusDiv.className = 'status success';
                    document.getElementById('title').value = '';
                    document.getElementById('content').value = '';
                } else {
                    const err = await response.json();
                    statusDiv.innerHTML = `❌ 发布失败：${err.message}`;
                    statusDiv.className = 'status error';
                }
            } catch (error) {
                statusDiv.innerHTML = `❌ 网络错误：${error.message}`;
                statusDiv.className = 'status error';
            }
        }
    </script>
</body>
</html>
