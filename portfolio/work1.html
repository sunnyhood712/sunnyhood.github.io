      <article>
        <img src="work1.jpeg" alt="手工刺绣上衣" />
        <p>这件上衣原本是一件穿旧了的白色棉麻衬衫，领口有些泛黄，袖口也磨破了。我舍不得扔，就试着用刺绣把它补起来。</p>
        <p>我在袖口绣了几片小叶子，又在胸前绣了一朵简单的花。用的是最基础的平针和回针，没有复杂技巧，但一针一线缝下去，心里特别安静。</p>
        <p>做完之后，这件衣服好像真的重新活过来了。穿上它去菜市场，邻居还问我是在哪里买的。我笑着说，是自己改的。</p>
        <p>这就是我做作品集的原因：记录这些小小的、让生活变好的瞬间。</p>
      </article>
